<div id="tab-history" class="tab-content active">
      <div class="glass-card">
        <div class="card-title">History Filters</div>
        <div class="row-2">
          <div class="form-group">
            <label>Session Type</label>
            <select id="histType" onchange="renderHistory()">
              <option value="ALL">All Types</option>
              <option value="Single">Single Trick</option>
              <option value="Combo">Combo Sequence</option>
            </select>
          </div>
          <div class="form-group">
            <label>Category</label>
            <select id="histCat" onchange="renderHistory()">
              <option value="ALL">All Categories</option>
              <option value="SITTING">Sitting</option>
              <option value="WHEELING">Wheeling</option>
              <option value="SPINNING">Spinning</option>
              <option value="JUMPING">Jumping</option>
              <option value="OTHERS">Others</option>
            </select>
          </div>
        </div>
        <div class="row-2">
          <div class="form-group">
            <label>Family</label>
            <select id="histFam" onchange="renderHistory()">
              <option value="ALL">All Families</option>
              <option value="A">Family A</option>
              <option value="B">Family B</option>
              <option value="C">Family C</option>
              <option value="D">Family D</option>
              <option value="E">Family E</option>
            </select>
          </div>
          <div class="form-group">
            <label>Specific Date</label>
            <input type="date" id="histDate" onchange="renderHistory()">
          </div>
        </div>
        <div class="row-2">
          <div class="form-group">
            <label>Month Filter</label>
            <input type="month" id="histMonth" onchange="renderHistory()">
          </div>
          <div class="form-group" style="display:flex; align-items:flex-end;">
            <button type="button" id="btnClearHistFilters" class="btn btn-secondary btn-sm" style="width:100%; height:42px;" onclick="clearHistoryFilters()">Clear Filters</button>
          </div>
        </div>
      </div>

      <div id="historyList"></div>
    </div>
