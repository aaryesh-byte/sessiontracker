<div id="tab-history" class="tab-content active">
  <!-- WEEKLY SUMMARY GENERATOR BAR -->
  <div class="weekly-summary-trigger-card">
    <div>
      <div style="font-family:var(--font-display); font-weight:800; font-size:0.95rem; color:var(--primary); display:flex; align-items:center; gap:6px;">
        <span>📅</span><span>Coach Weekly Summary Report</span>
      </div>
      <div class="label-caps" style="margin-top:2px;">Generate Monday–Sunday structured report for coaching staff</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
      <input type="date" id="histWeeklyPicker" style="width:auto; min-height:36px; padding:4px 8px; font-size:0.75rem;" title="Select any date within target week">
      <button type="button" class="btn btn-secondary btn-sm" onclick="handleGenerateWeeklySummaryClick()" style="border-color:var(--primary-dim); color:var(--primary);">
        📋 Generate Weekly Summary
      </button>
    </div>
  </div>

  <!-- HISTORY FILTERS -->
  <div class="glass-card">
    <div class="card-title">Session Telemetry Filters</div>
    <div class="row-2">
      <div class="form-group">
        <label>Session Type</label>
        <select id="histType" onchange="renderHistory()">
          <option value="ALL">All Types</option>
          <option value="Single">Single Trick</option>
          <option value="Combo">Combo Sequence</option>
        </select>
      </div>
      <div class="form-group">
        <label>Month Filter</label>
        <input type="month" id="histMonth" onchange="renderHistory()">
      </div>
    </div>
    <div class="row-2" style="align-items:flex-end;">
      <div class="form-group" style="margin-bottom:0;">
        <label>Specific Date Filter</label>
        <input type="date" id="histDate" onchange="renderHistory()">
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <button type="button" class="btn btn-secondary" style="width:100%; min-height:44px;" onclick="clearHistoryDateFilter()">Clear Date Filter</button>
      </div>
    </div>
  </div>

  <!-- CHRONOLOGICAL SESSION HISTORY FEED -->
  <div id="historyList"></div>
</div>
