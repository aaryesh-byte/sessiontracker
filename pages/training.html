<div id="tab-log" class="tab-content">
      <div class="glass-card">
        <div class="card-title">Log Training Session</div>

        <form id="multiSessionForm" onsubmit="handleMultiSessionSubmit(event)">
          <div class="row-2">
            <div class="form-group">
              <label>Skater Protocol</label>
              <input type="text" id="logSkater" readonly style="font-weight:700;">
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="logDate" required>
            </div>
          </div><div id="tab-log" class="tab-content">
      <!-- Quick Rest Day Logger -->
      <div class="glass-card" style="border-left:4px solid #f59e0b; margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <div>
            <div style="font-family:var(--font-display); font-size:1rem; font-weight:700; color:#fbbf24;">🛋️ Log Rest Day</div>
            <div style="font-size:0.75rem; color:var(--on-surface-muted);">Record an intentional recovery day to keep your training timeline accurate.</div>
          </div>
        </div>
        <form onsubmit="return handleRestDaySubmit(event)" style="display:grid; grid-template-columns:1fr 1.5fr auto; gap:10px; align-items:flex-end;">
          <div class="form-group" style="margin-bottom:0;">
            <label>Rest Date</label>
            <input type="date" id="logRestDate" required>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label>Reason / Note (Optional)</label>
            <input type="text" id="logRestNotes" placeholder="e.g. Active recovery, Travel, Fatigue">
          </div>
          <button type="submit" class="btn btn-secondary" style="min-height:44px; padding:0 16px; border-color:rgba(245,158,11,0.4); color:#fbbf24; white-space:nowrap;">
            Log Rest Day
          </button>
        </form>
      </div>

      <div class="glass-card">
        <div class="card-title">Log Training Session</div>

        <form id="multiSessionForm" onsubmit="handleMultiSessionSubmit(event)">
          <div class="row-2">
            <div class="form-group">
              <label>Skater Protocol</label>
              <input type="text" id="logSkater" readonly style="font-weight:700;">
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="logDate" required>
            </div>
          </div>

          <div class="form-group">
            <label style="margin-bottom:10px;">Session Practiced Items (Individual Drills & Combos)</label>
            <div id="sessionItemsContainer"></div>
            
            <div style="display:flex; gap:10px; margin-top:10px;">
              <button type="button" class="btn btn-secondary btn-sm" onclick="addSessionItem('single')">+ Add Individual Trick</button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="addSessionItem('combo')">+ Add Combo Sequence</button>
            </div>
          </div>

          <div class="form-group" style="margin-top:16px;">
            <label>Overall Session Notes</label>
            <input type="text" id="logSessionGlobalNotes" placeholder="e.g. High speed slalom session at main arena">
          </div>

          <button type="submit" class="btn" style="margin-top:12px;">Finish & Log Session</button>
        </form>

      </div>
    </div>
