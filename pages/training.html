<div id="tab-log" class="tab-content active">
      <!-- Quick Rest Day Logger -->
      <div class="glass-card rest-day-card">
        <div class="rest-day-header">
          <div class="rest-day-title">🛋️ Log Rest Day</div>
          <div class="rest-day-subtitle">Record an intentional recovery day to keep your training timeline accurate.</div>
        </div>
        <form onsubmit="return handleRestDaySubmit(event)" class="rest-day-form">
          <div class="form-group rest-day-date-group">
            <label>Rest Date</label>
            <input type="date" id="logRestDate" required>
          </div>
          <div class="form-group rest-day-notes-group">
            <label>Reason / Note (Optional)</label>
            <input type="text" id="logRestNotes" placeholder="e.g. Active recovery, Travel, Fatigue">
          </div>
          <button type="submit" class="btn btn-secondary btn-rest-submit">
            Log Rest Day
          </button>
        </form>
      </div>

      <div class="glass-card training-session-card">
        <div class="card-title" style="color:#38bdf8;">Log Training Session</div>

        <form id="multiSessionForm" onsubmit="handleMultiSessionSubmit(event)">
          <div class="row-2">
            <div class="form-group">
              <label>Skater Protocol</label>
              <input type="text" id="logSkater" readonly style="font-weight:700;">
            </div>
            <div class="form-group">
              <label>Date</label>
              <input type="date" id="logDate" required>
            </div>
          </div>

          <!-- Training Log Components (Individual Trick / Combo) -->
          <div class="form-group" style="margin-top:16px;">
            <label style="margin-bottom:8px;">Training Session Practiced Components</label>

            <!-- Drills & Combos Container -->
            <div id="sessionItemsContainer"></div>
            
            <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;">
              <button type="button" class="btn btn-secondary btn-sm" onclick="addSessionItem('single')">+ Individual Trick</button>
              <button type="button" class="btn btn-secondary btn-sm" onclick="addSessionItem('combo')">+ Trick Combo</button>
            </div>
          </div>

          <div class="form-group" style="margin-top:16px;">
            <label>Overall Session Notes</label>
            <input type="text" id="logSessionGlobalNotes" placeholder="e.g. High speed slalom session at main arena">
          </div>

          <button type="submit" class="btn" style="margin-top:12px;">Finish & Log Session</button>
        </form>

      </div>
    </div>
